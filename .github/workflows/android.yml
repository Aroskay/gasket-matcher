name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          # Buildozer'ın tüm indirdiği ve derlediği dosyalar buradadır
          path: |
            .buildozer
            ~/.buildozer
          # buildozer.spec değişirse cache'i yenile
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer- 

      - name: Setup Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake build-essential libltdl-dev ccache
      
      - name: Install Buildozer & Cython Fix
        run: |
          python -m pip install --upgrade pip
          # NDK 26b ile tam uyumlu çalışması için Cython sürümünü sabitledik
          pip install buildozer "cython<3.0.0" virtualenv

      - name: Clean Old Build Artifacts
        run: |
          rm -rf .buildozer/android/platform/android-ndk-r26b
          rm -rf .buildozer/android/platform/build-armeabi-v7a
          rm -rf .buildozer/android/platform/build-arm64-v8a

      - name: Accept Android SDK Licenses
        run: yes | buildozer android debug || true

      - name: Build APK with Buildozer
        run: |
          # Önce cache varsa bile eski/hatalı platform dosyalarını temizleyelim
          rm -rf .buildozer/android/platform/android-ndk-*
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GasketMatcher-APK
          path: bin/*.apk
