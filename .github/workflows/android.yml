name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # GitHub Actions'ın Node.js 20 yerine güncel Node.js 24 kullanmasını zorunlu kılıyoruz
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython Fix
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "Cython<3.0.0" virtualenv

      - name: Accept Android SDK Licenses
        run: yes | buildozer android debug || true

      - name: Build APK with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GasketMatcher-APK
          path: bin/*.apk
