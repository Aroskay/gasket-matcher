name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 🚨 404 HATASINI ÇÖZEN SATIR: Buildozer'a sistemdeki hazır NDK'yı zorla gösteriyoruz
  P4A_ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer & Modern Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Accept Android SDK Licenses
        run: yes | buildozer android debug || true

      - name: Build APK with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GasketMatcher-APK
          path: bin/*.apk
