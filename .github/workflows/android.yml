name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # GitHub arayüzünden manuel tetiklemek için

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Kivy ve Buildozer için en stabil sürüm

      - name: Install System Dependencies
        run: |
          sudo apt update
          # Buildozer ve Android NDK için zorunlu sistem kütüphaneleri
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Accept Android SDK Licenses
        run: yes | buildozer android debug || true

      - name: Build APK with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GasketMatcher-APK
          path: bin/*.apk
